<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統優化紀錄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1e2433; --muted:#6b7488;
    --line:#e6e9f0; --brand:#3b5bdb; --brand-d:#2f49b0; --brand-l:#edf0fd;
    --danger:#e03131; --ok:#2f9e44; --shadow:0 1px 3px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px;padding:9px 16px;transition:.15s}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .btn-primary{background:var(--brand);color:#fff;font-weight:600}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn-danger{background:#fff;border:1px solid var(--line);color:var(--danger)}
  .btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
  .hidden{display:none!important}

  /* ---- Login ---- */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px;width:100%;max-width:380px}
  .login-card h1{margin:0 0 4px;font-size:22px}
  .login-card p.sub{margin:0 0 24px;color:var(--muted);font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .login-card button{width:100%;margin-top:6px}
  .switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
  .switch a{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:600}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:12px}
  .msg.err{background:#fff0f0;color:var(--danger)}
  .msg.ok{background:#ebfbee;color:var(--ok)}

  /* ---- App shell ---- */
  header{background:#D8D8EB;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .hwrap{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px}
  .logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .logo .badge{background:var(--brand);color:#fff;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:18px}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--muted)}
  /* 版面：側邊分頁 + 內容 */
  .shell{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
  .side{position:sticky;top:78px}
  .snav{display:flex;flex-direction:column;gap:2px}
  .snav-item{display:flex;gap:8px;align-items:baseline;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;border:1px solid transparent;font-size:14px}
  .snav-item b{font-weight:600;color:var(--muted);font-size:12.5px;flex:none}
  .snav-item:hover{background:var(--card);border-color:var(--line)}
  .snav-item.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:600}
  .snav-item.on b{color:var(--brand-d)}
  .snav-sec{display:flex;gap:8px;padding:16px 12px 6px;font-size:14px;font-weight:700;color:var(--ink)}
  .snav-sec b{font-weight:600;color:var(--muted);font-size:12.5px}
  .snav-sub{padding-left:22px}
  main{min-width:0}
  /* 需求書檔案頁 */
  .mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .mhead h2{margin:0;font-size:20px;flex:1;min-width:180px}
  .mfolder{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand-d);text-decoration:none;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px}
  .mfolder:hover{border-color:var(--brand)}
  .tablewrap{overflow-x:auto;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
  .ftable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
  .ftable th{text-align:left;font-size:12.5px;color:#5a5876;font-weight:600;padding:12px 14px;background:#D8D8EB;border-bottom:1px solid #c4c4dc;white-space:nowrap}
  .ftable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .ftable tr:last-child td{border-bottom:none}
  .fname{font-weight:600}
  .ftype{font-size:12.5px;color:var(--muted)}
  .fnew{display:inline-block;margin-left:8px;background:#ebfbee;color:#2f9e44;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
  .fopen{color:var(--brand-d);font-weight:600;text-decoration:none;white-space:nowrap}
  .fopen:hover{text-decoration:underline}
  .facts{display:flex;gap:6px;white-space:nowrap}
  .btn-sm{padding:6px 12px;font-size:13px}
  .mfilter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px}
  .mfilter label{font-size:13px;color:var(--muted)}
  .mfilter input{width:auto}
  /* ---- 專案排程時間軸 ---- */
  .panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .schbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .schbar .f{display:flex;flex-direction:column;gap:4px}
  .schbar .f label{font-size:12px;color:var(--muted)}
  .schbar input,.schbar select{width:auto}
  .tl-scroll{overflow-x:auto;padding:4px 0 2px}
  .tl-track{position:relative;height:210px}
  .axis-line{position:absolute;left:40px;top:150px;height:2px;background:#3a3f4b}
  .tick-dot{position:absolute;top:145px;width:11px;height:11px;border-radius:50%;background:#9aa0ad;transform:translateX(-50%)}
  .tick-date{position:absolute;top:166px;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
  .ms{position:absolute;top:24px;width:100px;transform:translateX(-50%);text-align:center;font-size:13px;font-weight:600;
      line-height:1.3;padding:9px 6px;border-radius:12px;border:1px solid #d7dbe6;box-shadow:0 1px 2px rgba(20,30,60,.10);
      cursor:pointer;transition:.12s;background:#fff}
  .ms:hover{transform:translateX(-50%) translateY(-2px);border-color:var(--brand)}
  .ms.sel{box-shadow:0 0 0 3px var(--brand-l);border-color:var(--brand)}
  .ms .ms-date{display:block;font-weight:500;color:#6b7488;font-size:11px;margin-top:3px}
  .ms-mark{position:absolute;top:143px;width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);transform:translateX(-50%)}
  .ms-stem{position:absolute;width:2px;background:#c9cdd8;transform:translateX(-50%)}
  .ms-edit{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .ms-edit .fld{display:flex;flex-direction:column;gap:4px}
  .ms-edit label{font-size:12px;color:var(--muted)}
  .ms-edit input[type=color]{width:46px;height:38px;padding:2px;cursor:pointer}
  .ms-edit .grow{flex:1;min-width:150px}
  .ms-edit .grow input{width:100%}
  @media(max-width:760px){
    .shell{grid-template-columns:1fr;gap:14px;padding:16px}
    .side{position:static}
    .snav{flex-direction:row;flex-wrap:wrap}
  }

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);padding:16px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px}
  .toolbar .fbreak{flex-basis:100%;height:0;margin:0;padding:0}
  .toolbar .f{display:flex;flex-direction:column;gap:5px}
  .toolbar .f label{font-size:12px;color:var(--muted)}
  .toolbar .grow{flex:1;min-width:180px}
  .toolbar input,.toolbar select{min-width:130px}

  .stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .stat{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 18px;flex:1;min-width:130px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}

  .list{display:flex;flex-direction:column;gap:12px}
  .rec{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--brand)}
  .rec .top{display:flex;align-items:flex-start;gap:10px}
  .rec .cat{background:var(--brand-l);color:var(--brand-d);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .badge-st{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .st-uat {background:#fff4e6;color:#d9480f}   /* 測試中 */
  .st-done{background:#e7f5ff;color:#1971c2}   /* 測試完成 */
  .st-prod{background:#ebfbee;color:#2f9e44}   /* 上正式 */
  .st-todo{background:#f1f3f5;color:#868e96}   /* 待處理 */
  .rec h3{margin:0;font-size:16px;flex:1}
  .rec .date{font-size:12px;color:var(--muted);white-space:nowrap}
  .rec .desc{margin:10px 0 0;color:#3c4356;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .rec .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted);align-items:center}
  .rec .meta a{color:var(--brand);text-decoration:none}
  .rec .meta a:hover{text-decoration:underline}
  .rec .acts{display:flex;gap:8px;margin-top:12px}
  .rec .acts button{padding:6px 12px;font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,26,45,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:26px}
  .modal h2{margin:0 0 20px;font-size:19px}
  .modal .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .modal .row{display:flex;gap:12px}
  .modal .row .field{flex:1}
  .modal-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  textarea{resize:vertical;min-height:90px}
  .req{color:var(--danger)}
  /* 富文字編輯器 */
  .rte-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 8px;background:#fafbfe}
  .rte-toolbar button{width:auto;min-width:30px;height:30px;padding:0 8px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .rte-toolbar button:hover{border-color:var(--brand);color:var(--brand)}
  .rte-toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .rte-toolbar .sw{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
  .rte-toolbar .sw-none{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e03131 3px,#e03131 4px)}
  .rte-toolbar .rte-size{width:auto;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
  .rte{border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px 11px;min-height:110px;max-height:320px;overflow:auto;font-size:14px;line-height:1.6;white-space:pre-wrap;background:#fff}
  .rte:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .rte:empty:before{content:attr(data-placeholder);color:#adb5bd}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer;font-size:14px;user-select:none;background:#fff}
  .chip input{width:auto;margin:0}
  .chip:has(input:checked){background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:600}
  .rec .venue{background:#f3f0ff;color:#5f3dc4;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
  .ro-badge{background:#fff4e6;color:#d9480f;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
  body.readonly #newBtn, body.readonly .rec .acts{display:none!important}

  @media(max-width:600px){
    .modal .row{flex-direction:column;gap:0}
    .hwrap,main{padding-left:14px;padding-right:14px}
  }
</style>
</head>
<body>

<!-- ========== 登入畫面 ========== -->
<div id="loginView">
  <div class="login-card">
    <h1>🛠️ 系統優化紀錄</h1>
    <p class="sub" id="loginSub">請登入以繼續</p>
    <div class="field">
      <label>帳號（Email）</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="authBtn">登入</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ========== 主應用 ========== -->
<div id="appView" class="hidden">
  <header>
    <div class="hwrap">
      <div class="logo"><span class="badge">🛠️</span> 系統優化紀錄</div>
      <div class="spacer"></div>
      <span class="ro-badge hidden" id="roBadge">🔒 唯讀模式</span>
      <span class="who" id="who"></span>
      <button class="btn-ghost" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="shell">
  <aside class="side">
    <nav class="snav" aria-label="頁面導覽">
      <a class="snav-item on" href="#/" data-nav="home"><b>1.</b>優化紀錄（首頁）</a>
      <a class="snav-item" href="#/sched" data-nav="sched"><b>2.</b>專案排程</a>
      <div class="snav-sec"><b>3.</b>需求書</div>
      <div id="navReq"></div>
      <div class="snav-sec"><b>4.</b>會議記錄</div>
      <div id="navMtg"></div>
    </nav>
  </aside>

  <main>
    <section id="viewHome">
    <!-- 查詢工具列 -->
    <div class="toolbar">
      <div class="f grow">
        <label>關鍵字（標題 / 說明）</label>
        <input type="text" id="qKeyword" placeholder="輸入關鍵字…">
      </div>
      <div class="f">
        <label>系統分類</label>
        <select id="qCategory"><option value="">全部</option></select>
      </div>
      <div class="f">
        <label>場地</label>
        <select id="qVenue">
          <option value="">全部</option>
          <option value="CB">CB</option>
          <option value="MX">MX</option>
          <option value="SIV">SIV</option>
        </select>
      </div>
      <div class="f">
        <label>狀態</label>
        <select id="qStatus">
          <option value="">全部</option>
          <option value="待辦">待辦</option>
          <option value="測試中">測試中</option>
          <option value="測試完成">測試完成</option>
          <option value="更版完成">更版完成</option>
        </select>
      </div>
      <div class="fbreak"></div>
      <div class="f">
        <label>上UAT起日</label>
        <input type="date" id="qFrom">
      </div>
      <div class="f">
        <label>上UAT迄日</label>
        <input type="date" id="qTo">
      </div>
      <div class="f">
        <label>&nbsp;</label>
        <button class="btn-ghost" id="clearBtn">清除</button>
      </div>
      <div class="f">
        <label>&nbsp;</label>
        <button class="btn-primary" id="newBtn">＋ 新增紀錄</button>
      </div>
      <div class="f">
        <label>&nbsp;</label>
        <button class="btn-ghost" id="pdfListBtn">📄 匯出清單 PDF</button>
      </div>
    </div>

    <div class="list" id="list"></div>
    </section>

    <section id="viewSched" class="hidden">
      <div class="panel">
        <div class="schbar">
          <div class="f">
            <label>專案</label>
            <select id="scProj"></select>
          </div>
          <div class="f">
            <label>開始</label>
            <input type="date" id="scStart">
          </div>
          <div class="f">
            <label>結束</label>
            <input type="date" id="scEnd">
          </div>
          <button class="btn-primary hidden" id="scAddBtn">＋ 新增里程碑</button>
          <button class="btn-primary hidden" id="scSaveBtn">儲存</button>
          <span id="scSaveHint" style="font-size:12.5px;color:var(--muted)"></span>
        </div>
      </div>

      <div class="panel">
        <div class="tl-scroll"><div class="tl-track" id="scTrack"></div></div>
      </div>

      <div class="panel">
        <div class="card-head" style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <h2 style="font-size:16px;margin:0;flex:1">內容 / 備註 — <span class="selname" id="scSelName" style="font-weight:700;color:var(--brand-d)">整體專案</span></h2>
        </div>
        <div class="ms-edit hidden" id="scMsEdit">
          <div class="fld grow"><label>里程碑名稱</label><input type="text" id="scEdLabel" placeholder="例：CRUD+功能開發"></div>
          <div class="fld"><label>日期</label><input type="date" id="scEdDate"></div>
          <div class="fld"><label>顏色</label><input type="color" id="scEdColor" value="#ffffff"></div>
          <div class="fld"><label>&nbsp;</label><button class="btn-danger" id="scEdDel">刪除里程碑</button></div>
        </div>
        <div class="rte-toolbar" id="scTb">
          <button type="button" data-cmd="bold" title="粗體"><b>B</b></button>
          <button type="button" data-cmd="italic" title="斜體"><i>I</i></button>
          <button type="button" data-cmd="underline" title="底線"><u>U</u></button>
          <span class="sep"></span>
          <button type="button" data-cmd="hiliteColor" data-value="#fff3bf" title="黃底"><span class="sw" style="background:#fff3bf"></span></button>
          <button type="button" data-cmd="hiliteColor" data-value="#d3f9d8" title="綠底"><span class="sw" style="background:#d3f9d8"></span></button>
          <button type="button" data-cmd="hiliteColor" data-value="transparent" title="移除底色"><span class="sw sw-none"></span></button>
          <span class="sep"></span>
          <button type="button" data-cmd="foreColor" data-value="#e03131" title="紅字"><span style="color:#e03131;font-weight:700">A</span></button>
          <button type="button" data-cmd="foreColor" data-value="#1971c2" title="藍字"><span style="color:#1971c2;font-weight:700">A</span></button>
          <span class="sep"></span>
          <select id="scFontSize" class="rte-size" title="字體大小">
            <option value="">字級</option><option value="13px">小</option><option value="15px">預設</option>
            <option value="18px">大</option><option value="24px">特大</option><option value="32px">超大</option>
          </select>
          <span class="sep"></span>
          <button type="button" data-cmd="removeFormat" title="清除格式">清除</button>
        </div>
        <div id="scEditor" class="rte" contenteditable="true" data-placeholder="撰寫此項目的內容…"></div>
      </div>
    </section>

    <section id="viewReq" class="hidden">
      <div class="mhead">
        <h2 id="mTitle"></h2>
        <a class="mfolder hidden" id="mFolder" href="#" target="_blank" rel="noopener"></a>
        <button class="btn-primary hidden" id="addFileBtn">＋ 新增檔案</button>
      </div>
      <div id="mBody"></div>
    </section>

    <section id="viewMtg" class="hidden">
      <div class="mhead">
        <h2 id="mtgTitle"></h2>
        <button class="btn-primary hidden" id="addMtgBtn">＋ 新增會議</button>
      </div>
      <div class="mfilter">
        <label>會議日期</label>
        <input type="date" id="mtgFrom" aria-label="起始日期">
        <span>—</span>
        <input type="date" id="mtgTo" aria-label="結束日期">
        <button class="btn-ghost btn-sm" id="mtgClear">清除</button>
      </div>
      <div id="mtgBody"></div>
    </section>
  </main>
  </div>

<script>
// ================= Supabase 初始化 =================
const cfg = window.SUPABASE_CONFIG || {};
let sb = null;
try {
  sb = supabase.createClient(cfg.url, cfg.anonKey);
} catch(e){}

const $ = id => document.getElementById(id);
let ALL = [];          // 全部紀錄
let CURRENT_USER = null;
let IS_OWNER = true;

// ================= 登入邏輯 =================
function setLoginMsg(txt, type){
  const el = $("loginMsg");
  el.className = "msg " + (type||"");
  el.textContent = txt || "";
  if(!txt) el.className = "";
}

$("authBtn").addEventListener("click", async ()=>{
  const email = $("email").value.trim();
  const pw    = $("password").value;
  if(!email || !pw){ setLoginMsg("請輸入帳號與密碼","err"); return; }
  if(!sb){ setLoginMsg("尚未設定 Supabase，請先編輯 config.js","err"); return; }
  $("authBtn").disabled = true;
  try{
    const {error} = await sb.auth.signInWithPassword({email, password:pw});
    if(error) throw error;
  }catch(err){
    setLoginMsg(translateErr(err.message), "err");
  }finally{
    $("authBtn").disabled = false;
  }
});

$("password").addEventListener("keydown", e=>{ if(e.key==="Enter") $("authBtn").click(); });

function translateErr(m){
  if(/Invalid login/i.test(m)) return "帳號或密碼錯誤";
  if(/already registered/i.test(m)) return "此 Email 已註冊，請直接登入";
  if(/at least 6/i.test(m)) return "密碼至少需 6 個字元";
  if(/Email not confirmed/i.test(m)) return "Email 尚未驗證，請先收信驗證";
  return m;
}

$("logoutBtn").addEventListener("click", async ()=>{ await sb.auth.signOut(); });

// 監聽登入狀態
if(sb){
  sb.auth.onAuthStateChange((_ev, session)=>{
    if(session && session.user){ enterApp(session.user); }
    else { leaveApp(); }
  });
  sb.auth.getSession().then(({data})=>{
    if(data.session) enterApp(data.session.user);
  });
} else {
  setLoginMsg("尚未設定 Supabase，請先編輯 config.js 填入 url 與 anonKey","err");
}

function enterApp(user){
  CURRENT_USER = user;
  // 唯讀（公用）帳號清單內 → 唯讀；其餘（含擁有者）可編輯
  const ro = ((window.APP_CONFIG && window.APP_CONFIG.readonlyEmails) || []).map(e=>String(e).toLowerCase());
  IS_OWNER = !ro.includes(String(user.email).toLowerCase());
  document.body.classList.toggle("readonly", !IS_OWNER);
  $("roBadge").classList.toggle("hidden", IS_OWNER);
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = user.email;
  loadData();
  initReq();
}
function leaveApp(){
  CURRENT_USER = null; ALL = [];
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("password").value = "";
}

// ================= 資料讀取 =================
async function loadData(){
  const {data, error} = await sb.from("optimizations")
    .select("*").order("created_at",{ascending:false});
  if(error){ alert("讀取失敗："+error.message); return; }
  ALL = data || [];
  refreshCategoryOptions();
  render();
}

function refreshCategoryOptions(){
  const cats = [...new Set(ALL.map(r=>r.category).filter(Boolean))].sort();
  const sel = $("qCategory");
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + cats.map(c=>`<option>${esc(c)}</option>`).join("");
  sel.value = cur;
  $("catList").innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join("");
}

// 狀態：依已填日期自動判斷（上正式 > 測試完成 > 測試中 > 待處理）
function calcStatus(r){
  // 更版完成：更版日期時間必須「已到／已過」；未來的更版日期先不算完成
  if(r.release_date){
    const rel = new Date(String(r.release_date).replace(" ","T"));
    if(!isNaN(rel) && rel <= new Date()) return {label:"更版完成", cls:"st-prod"};
  }
  if(r.test_done_date) return {label:"測試完成", cls:"st-done"};
  if(r.uat_date)       return {label:"測試中",   cls:"st-uat"};
  return {label:"待辦",   cls:"st-todo"};
}
// 把 timestamp 字串（2026-07-27T14:30:00）顯示成 2026-07-27 14:30:00
function fmtDT(s){ return s ? String(s).replace("T"," ").slice(0,19) : ""; }
// 建立時間（帶時區的 ISO）顯示成本地日期 2026-07-29
function fmtDate(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d)) return String(s).slice(0,10);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

// ================= 篩選 + 渲染 =================
function getFiltered(){
  const kw = $("qKeyword").value.trim().toLowerCase();
  const cat = $("qCategory").value;
  const venue = $("qVenue").value;
  const status = $("qStatus").value;
  const from = $("qFrom").value;   // 篩選以「上 UAT 日期」為主
  const to   = $("qTo").value;
  return ALL.filter(r=>{
    if(cat && r.category !== cat) return false;
    if(venue && !(r.venues && r.venues.some(v=>String(v).toUpperCase()===venue.toUpperCase()))) return false;
    if(status && calcStatus(r).label !== status) return false;
    if(from && (!r.uat_date || r.uat_date < from)) return false;
    if(to   && (!r.uat_date || r.uat_date > to)) return false;
    if(kw){
      const hay = ((r.title||"")+" "+(r.description||"")).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
}

function render(){
  const rows = getFiltered();
  const list = $("list");
  if(rows.length === 0){
    list.innerHTML = '<div class="empty">目前沒有符合條件的紀錄。<br>點右上「＋ 新增紀錄」開始建立。</div>';
    return;
  }
  list.innerHTML = rows.map(r=>{
    const st = calcStatus(r);
    return `
    <div class="rec">
      <div class="top">
        <span class="cat">${esc(r.category||"未分類")}</span>
        ${(r.venues&&r.venues.length)?r.venues.map(v=>`<span class="venue">${esc(String(v).toUpperCase())}</span>`).join(""):""}
        <h3>${esc(r.title||"")}</h3>
        <span class="badge-st ${st.cls}">${st.label}</span>
      </div>
      ${r.description?`<div class="desc">${renderDesc(r.description)}</div>`:""}
      <div class="meta">
        ${r.created_at?`<span>🗓️ 建立 ${fmtDate(r.created_at)}</span>`:""}
        ${r.uat_date?`<span>🧪 上UAT ${r.uat_date}</span>`:""}
        ${r.test_done_date?`<span>✅ 測完 ${r.test_done_date}</span>`:""}
        ${r.release_date?`<span>🚀 更版 ${fmtDT(r.release_date)}</span>`:""}
        ${r.executor?`<span>👤 ${esc(r.executor)}</span>`:""}
        ${r.requirement_url?`<span>🔗 <a href="${esc(r.requirement_url)}" target="_blank" rel="noopener">需求書</a></span>`:""}
      </div>
      <div class="acts">
        <button class="btn-ghost" onclick="openEdit('${r.id}')">編輯</button>
        <button class="btn-danger" onclick="delRec('${r.id}')">刪除</button>
      </div>
    </div>`;
  }).join("");
}

["qKeyword","qCategory","qVenue","qStatus","qFrom","qTo"].forEach(id=> $(id).addEventListener("input", render));
$("clearBtn").addEventListener("click", ()=>{
  $("qKeyword").value=""; $("qCategory").value=""; $("qVenue").value=""; $("qStatus").value=""; $("qFrom").value=""; $("qTo").value="";
  render();
});

// ================= 新增 / 編輯 =================
$("newBtn").addEventListener("click", ()=> openEdit(null));
$("cancelBtn").addEventListener("click", closeModal);
$("editOverlay").addEventListener("click", e=>{ if(e.target.id==="editOverlay") closeModal(); });

function openEdit(id){
  if(!IS_OWNER) return;   // 唯讀帳號不可編輯
  const r = id ? ALL.find(x=>x.id===id) : null;
  $("modalTitle").textContent = r ? "編輯優化紀錄" : "新增優化紀錄";
  $("fId").value       = r ? r.id : "";
  $("fCategory").value = r ? (r.category||"") : "";
  const vs = ((r && r.venues) || []).map(v=>String(v).toUpperCase());
  document.querySelectorAll("#fVenues input").forEach(c=> c.checked = vs.includes(c.value.toUpperCase()));
  $("fTitle").value    = r ? (r.title||"") : "";
  // 說明：舊資料為純文字（可能含換行）、新資料為 HTML
  const desc = r ? (r.description||"") : "";
  if(/<[a-z/][\s\S]*>/i.test(desc)) $("fDesc").innerHTML = sanitizeHtml(desc);
  else $("fDesc").textContent = desc;   // 純文字（白色 pre-wrap 保留換行）
  $("fUat").value      = r ? (r.uat_date||"") : "";
  $("fTestDone").value = r ? (r.test_done_date||"") : "";
  // datetime-local 需要 YYYY-MM-DDTHH:MM(:SS) 格式
  $("fRelease").value  = r && r.release_date ? String(r.release_date).replace(" ","T").slice(0,19) : "";
  $("fUrl").value      = r ? (r.requirement_url||"") : "";
  $("fExec").value     = r ? (r.executor||"") : "";
  $("modalMsg").innerHTML = "";
  refreshCategoryOptions();
  updateStatusPreview();
  $("editOverlay").classList.remove("hidden");
  $("fTitle").focus();
}
function closeModal(){ $("editOverlay").classList.add("hidden"); }

// 表單內即時預覽狀態
function updateStatusPreview(){
  const st = calcStatus({
    uat_date: $("fUat").value || null,
    test_done_date: $("fTestDone").value || null,
    release_date: $("fRelease").value || null
  });
  $("fStatusPreview").innerHTML = `<span class="badge-st ${st.cls}">${st.label}</span>`;
}
["fUat","fTestDone","fRelease"].forEach(id=> $(id).addEventListener("input", updateStatusPreview));

// ---- 可重複使用的富文字編輯器（說明、會議內容共用） ----
function initRichEditor(toolbar, editor, fontSel){
  let saved = null;
  const save = ()=>{ const s=window.getSelection(); if(s.rangeCount && editor.contains(s.anchorNode)) saved=s.getRangeAt(0).cloneRange(); };
  const restore = ()=>{ if(saved){ const s=window.getSelection(); s.removeAllRanges(); s.addRange(saved); } };
  editor.addEventListener("keyup", save);
  editor.addEventListener("mouseup", save);
  toolbar.addEventListener("mousedown", e=>{
    const btn = e.target.closest("button[data-cmd]");
    if(!btn) return;
    e.preventDefault();               // 保住編輯區的選取範圍
    editor.focus();
    try{ document.execCommand("styleWithCSS", false, true); }catch(_){}
    document.execCommand(btn.dataset.cmd, false, btn.dataset.value || null);
  });
  if(fontSel){
    fontSel.addEventListener("change", function(){
      const px = this.value; this.selectedIndex = 0;
      if(!px) return;
      editor.focus(); restore();
      const sel = window.getSelection();
      if(!sel.rangeCount || sel.isCollapsed){ alert("請先選取要調整大小的文字"); return; }
      document.execCommand("styleWithCSS", false, false);
      document.execCommand("fontSize", false, "7");
      editor.querySelectorAll('font[size="7"]').forEach(f=>{
        const span = document.createElement("span"); span.style.fontSize = px; span.innerHTML = f.innerHTML; f.replaceWith(span);
      });
      save();
    });
  }
}
initRichEditor($("rteToolbar"), $("fDesc"), $("rteFontSize"));

// 允許的標籤/屬性以外一律清掉（作者為擁有者，仍防注入）
function sanitizeHtml(html){
  if(!html) return "";
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input").forEach(el=>el.remove());
  div.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n = a.name.toLowerCase();
      if(n.startsWith("on")) el.removeAttribute(a.name);                       // 事件屬性
      else if((n==="href"||n==="src") && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
      else if(!["style","color","href","target","rel"].includes(n)) el.removeAttribute(a.name);
    });
    if(el.tagName==="A"){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener"); }
  });
  return div.innerHTML;
}
// contenteditable 內容是否實際為空
function descIsEmpty(el){ return el.textContent.trim()==="" && !el.querySelector("img"); }
// 顯示說明：新資料(HTML)消毒後渲染；舊資料(純文字)照字義跳脫

// ================= PDF 匯出（瀏覽器原生列印 → 另存為 PDF） =================
function printStyle(){
  return `
  <style>
    @page { size: A4; margin: 14mm; }
    *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;
       font-family:"Microsoft JhengHei","PMingLiU",sans-serif; }
    html,body{ margin:0; padding:0; color:#1e2433; }
    .doc h1{ font-size:20px; margin:0 0 6px; border-bottom:3px solid #3b5bdb; padding-bottom:8px; }
    .doc .gen{ font-size:11px; color:#888; margin:4px 0 18px; line-height:1.5; }
    .item{ border:1px solid #e0e4ee; border-radius:8px; padding:12px 14px; margin-bottom:12px; page-break-inside:avoid; }
    .item .h{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
    .item .cat{ background:#edf0fd; color:#2f49b0; font-size:11px; font-weight:bold; padding:3px 9px; border-radius:10px; }
    .item h2{ font-size:15px; margin:8px 0 0; line-height:1.4; }
    .item .d{ font-size:12px; color:#666; white-space:nowrap; }
    .item .desc{ font-size:12.5px; line-height:1.6; margin:8px 0 0; white-space:pre-wrap; color:#33384a; }
    .item .meta{ font-size:11.5px; color:#666; margin-top:8px; }
    .item .meta a{ color:#3b5bdb; text-decoration:none; }
    table{ width:100%; border-collapse:collapse; font-size:12.5px; }
    tr{ page-break-inside:avoid; }
    td{ padding:6px 8px; border:1px solid #e0e4ee; vertical-align:top; line-height:1.5; }
    td.k{ background:#f6f8fd; color:#666; width:96px; font-weight:bold; }
  </style>`;
}
function itemBlock(r){
  const st = calcStatus(r);
  const dates = [
    r.created_at?`建立 ${fmtDate(r.created_at)}`:"",
    r.uat_date?`上UAT ${r.uat_date}`:"",
    r.test_done_date?`測完 ${r.test_done_date}`:"",
    r.release_date?`更版 ${fmtDT(r.release_date)}`:""
  ].filter(Boolean).join("　｜　");
  return `<div class="item">
    <div class="h"><span class="cat">${esc(r.category||"未分類")}${(r.venues&&r.venues.length)?" · "+esc(r.venues.map(v=>String(v).toUpperCase()).join("/")):""}【${st.label}】</span>
      <span class="d">${esc(dates||"—")}</span></div>
    <h2>${esc(r.title||"")}</h2>
    ${r.description?`<div class="desc">${renderDesc(r.description)}</div>`:""}
    <div class="meta">
      ${r.executor?`執行人：${esc(r.executor)}　`:""}
      ${r.requirement_url?`需求書：<a href="${esc(r.requirement_url)}">${esc(r.requirement_url)}</a>`:""}
    </div>
  </div>`;
}

function runPdf(html, filename){
  // 用隱藏 iframe 載入排版好的內容，呼叫瀏覽器列印 → 使用者選「另存為 PDF」
  // 中文完美、不漏字、分頁乾淨、文字可選取
  const prev = document.getElementById("printFrame");
  if(prev) prev.remove();
  const iframe = document.createElement("iframe");
  iframe.id = "printFrame";
  iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(iframe);
  const title = String(filename).replace(/\.pdf$/i, "");   // 存檔預設檔名 = 文件標題
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${esc(title)}</title>${printStyle()}</head><body><div class="doc">${html}</div></body></html>`);
  doc.close();
  let done = false;
  const go = ()=>{ if(done) return; done = true; try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ console.error(e); alert("列印失敗："+(e&&e.message||e)); } };
  iframe.onload = go;
  setTimeout(go, 500);   // onload 有時不觸發，保險再叫一次
}

// 相對時間；超過 30 天顯示日期
function relTime(ts){
  const d = new Date(String(ts).replace(" ","T"));
  if(isNaN(d)) return String(ts).slice(0,16);
  const diff = (Date.now() - d.getTime())/60000;
  if(diff < 0)    return fmtDT(ts).slice(0,16);
  if(diff < 2)    return "剛剛";
  if(diff < 60)   return `${Math.floor(diff)} 分鐘前`;
  if(diff < 1440) return `${Math.floor(diff/60)} 小時前`;
  if(diff < 43200)return `${Math.floor(diff/1440)} 天前`;
  return fmtDate(ts);
}
function isRecent(ts){ const d=new Date(String(ts).replace(" ","T")); return !isNaN(d) && (Date.now()-d.getTime()) < 7*86400000; }

    </tr>`).join("")}</tbody></table></div>`;

// 路由：#/ 首頁、#/req/<系統>、#/mtg/<系統>
function routeReq(){
  const h = decodeURIComponent(location.hash.replace(/^#/,""));
  const reqWant = h.startsWith("/req/") ? h.slice(5) : null;
  const mtgWant = h.startsWith("/mtg/") ? h.slice(5) : null;
  const onSched = (h === "/sched");
  curSystem    = (reqWant && REQNAMES.includes(reqWant)) ? reqWant : null;
  curMtgSystem = (mtgWant && REQNAMES.includes(mtgWant)) ? mtgWant : null;
  const onReq = !!curSystem, onMtg = !!curMtgSystem;
  $("viewHome").classList.toggle("hidden", onReq || onMtg || onSched);
  $("viewSched").classList.toggle("hidden", !onSched);
  $("viewReq").classList.toggle("hidden", !onReq);
  $("viewMtg").classList.toggle("hidden", !onMtg);
  document.querySelectorAll(".snav-item").forEach(a=>{
    const href = a.getAttribute("href") || "";
    let on = false;
    if(a.dataset.nav === "home") on = !onReq && !onMtg && !onSched;
    else if(a.dataset.nav === "sched") on = onSched;
    else if(href.startsWith("#/req/")) on = decodeURIComponent(href.replace("#/req/","")) === curSystem;
    else if(href.startsWith("#/mtg/")) on = decodeURIComponent(href.replace("#/mtg/","")) === curMtgSystem;
    a.classList.toggle("on", on);
  });
  if(onReq) renderReq(curSystem);
  if(onMtg) renderMtg(curMtgSystem);
  if(onSched) buildSchedTimeline();
  window.scrollTo(0,0);
}

    if(to   && (!m.meet_date || m.meet_date > to)) return false;
    return true;

  if(!rows.length){

      ? `<div class="empty">此日期區間沒有會議記錄。<br>調整或按「清除」看全部。</div>`

    return;

  $("mtgBody").innerHTML = `<div class="list">${rows.map(m=>`
    <div class="rec">
      <div class="top">
        <span class="date">📅 ${m.meet_date||"—"}</span>

}

  const title = $("mtTitle").value.trim(), date = $("mtDate").value;
  if(!date || !title){ $("mtgModalMsg").innerHTML='<div class="msg err">會議日期與主題為必填</div>'; return; }
  const venues = [...document.querySelectorAll("#mtVenues input:checked")].map(c=>c.value);
  const payload = {
    category: $("mtCategory").value,
    meet_date: date,
    title,
    content: descIsEmpty($("mtgContent")) ? null : sanitizeHtml($("mtgContent").innerHTML),
    decisions: $("mtDecisions").value.trim() || null,
    venues: venues.length ? venues : null,
    link: $("mtLink").value.trim() || null
  };
  $("mtgSaveBtn").disabled = true;
  const id = $("mtId").value;
  let error;
  if(id) ({error} = await sb.from("meeting_notes").update(payload).eq("id", id));
  else   ({error} = await sb.from("meeting_notes").insert(payload));
  $("mtgSaveBtn").disabled = false;
  if(error){ $("mtgModalMsg").innerHTML=`<div class="msg err">儲存失敗：${esc(error.message)}</div>`; return; }
  $("mtgOverlay").classList.add("hidden");
  await loadMeetings();
});

async function delMtg(id){
  if(!IS_OWNER) return;
  const m = MEETINGS.find(x=>x.id===id);
  if(!confirm(`確定刪除會議「${m?m.title:""}」？`)) return;
  const {error} = await sb.from("meeting_notes").delete().eq("id", id);
  if(error){ alert("刪除失敗："+error.message); return; }
  await loadMeetings();
}
window.delMtg = delMtg;

initRichEditor($("mtgToolbar"), $("mtgContent"), $("mtgFontSize"));

// ================= 專案排程 =================
let SCHEDS = {}, SCHED_PROJECTS = [], curProj = null, curMs = -1;
const dayMs = 86400000;
const parseD = d => new Date(d + "T00:00:00");
const fmtMD = t => { const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate(); };
const PAD = 40, PPD = 15;

function initSched(visible){
  SCHED_PROJECTS = visible.map(r=>r.name);
  $("scProj").innerHTML = SCHED_PROJECTS.length
    ? SCHED_PROJECTS.map(n=>`<option>${esc(n)}</option>`).join("")
    : `<option value="">（無可檢視的專案）</option>`;
  const ro = !IS_OWNER;                 // 工程師唯讀
  $("scAddBtn").classList.toggle("hidden", ro);
  $("scSaveBtn").classList.toggle("hidden", ro);
  $("scStart").disabled = ro; $("scEnd").disabled = ro;
  $("scEditor").setAttribute("contenteditable", ro ? "false" : "true");
  $("scTb").style.display = ro ? "none" : "";
}

async function loadSchedules(){
  const {data, error} = await sb.from("project_schedules").select("*");
  SCHEDS = {};
  if(error) console.warn("project_schedules 讀取失敗：", error.message);
  else (data||[]).forEach(r=>{ if(!Array.isArray(r.milestones)) r.milestones=[]; SCHEDS[r.category]=r; });
}

function getSched(cat){
  if(!SCHEDS[cat]) SCHEDS[cat] = {category:cat, start_date:null, end_date:null, general_note:"", milestones:[]};
  if(!Array.isArray(SCHEDS[cat].milestones)) SCHEDS[cat].milestones = [];
  return SCHEDS[cat];
}
function curMsObj(){ return (curProj!=null && curMs>=0) ? getSched(curProj).milestones[curMs] : null; }

function openProject(cat){
  curProj = cat; curMs = -1;
  const s = getSched(cat);
  $("scStart").value = s.start_date || "";
  $("scEnd").value   = s.end_date || "";
  selectSchedContent(-1);
  buildSchedTimeline();
}

function buildSchedTimeline(){
  const track = $("scTrack");
  if(!curProj){ track.innerHTML=""; track.style.width="100%"; return; }
  const s = getSched(curProj);
  if(!s.start_date || !s.end_date){
    track.innerHTML = '<div class="hint" style="padding:20px;color:var(--muted)">設定專案開始與結束日期後即可顯示時間軸。</div>';
    track.style.width="100%"; return;
  }
  let start = parseD(s.start_date).getTime(), end = parseD(s.end_date).getTime();
  if(end < start){ const t=start; start=end; end=t; }
  s.milestones.forEach(m=>{ if(m.date){ const t=parseD(m.date).getTime(); if(t<start)start=t; if(t>end)end=t; }});
  const totalDays = Math.max(1, Math.round((end-start)/dayMs));
  const width = PAD*2 + totalDays*PPD;
  const x = t => PAD + Math.round((t-start)/dayMs)*PPD;
  let html = `<div class="axis-line" style="width:${width-PAD*2}px"></div>`;
  for(let t=start; t<=end+dayMs; t+=7*dayMs){
    html += `<div class="tick-dot" style="left:${x(t)}px"></div><div class="tick-date" style="left:${x(t)}px">${fmtMD(t)}</div>`;
  }
  s.milestones.forEach((m,i)=>{
    if(!m.date) return;
    const px = x(parseD(m.date).getTime());
    html += `<div class="ms-stem" style="left:${px}px;top:74px;height:70px"></div>`;
    html += `<div class="ms-mark" style="left:${px}px;background:${esc(m.color||'#fff')}"></div>`;
    html += `<div class="ms ${i===curMs?'sel':''}" data-i="${i}" style="left:${px}px;background:${esc(m.color||'#fff')}">${esc(m.label||'')}<span class="ms-date">${esc(m.date)}</span></div>`;
  });
  track.style.width = width + "px";
  track.innerHTML = html;
  track.querySelectorAll(".ms").forEach(el=> el.addEventListener("click", ()=> selectSchedContent(+el.dataset.i)));
}

function schedEditorToMem(){
  if(curProj==null) return;
  const s = getSched(curProj);
  if(curMs === -1) s.general_note = $("scEditor").innerHTML;
  else if(s.milestones[curMs]) s.milestones[curMs].content = $("scEditor").innerHTML;
}
function setSchedEditor(html){
  const h = html || "";
  if(/<[a-z/][\s\S]*>/i.test(h)) $("scEditor").innerHTML = sanitizeHtml(h);
  else $("scEditor").textContent = h;
}
function selectSchedContent(i){
  schedEditorToMem();
  curMs = i;
  const s = getSched(curProj);
  document.querySelectorAll("#scTrack .ms").forEach(x=>x.classList.remove("sel"));
  if(i === -1){
    $("scSelName").textContent = "整體專案";
    $("scMsEdit").classList.add("hidden");
    setSchedEditor(s.general_note || "");
  }else{
    const m = s.milestones[i];
    $("scSelName").textContent = m.label || "（未命名）";
    $("scMsEdit").classList.toggle("hidden", !IS_OWNER);
    $("scEdLabel").value = m.label||""; $("scEdDate").value = m.date||""; $("scEdColor").value = m.color||"#ffffff";
    setSchedEditor(m.content || "");
    const el = document.querySelector(`#scTrack .ms[data-i="${i}"]`); if(el) el.classList.add("sel");
  }
}

$("scProj").addEventListener("change", ()=> openProject($("scProj").value));
$("scStart").addEventListener("change", ()=>{ if(curProj!=null){ getSched(curProj).start_date=$("scStart").value||null; buildSchedTimeline(); }});
$("scEnd").addEventListener("change",   ()=>{ if(curProj!=null){ getSched(curProj).end_date=$("scEnd").value||null; buildSchedTimeline(); }});
$("scEdLabel").addEventListener("input", ()=>{ const m=curMsObj(); if(m){ m.label=$("scEdLabel").value; $("scSelName").textContent=m.label||"（未命名）"; buildSchedTimeline(); }});
$("scEdDate").addEventListener("change", ()=>{ const m=curMsObj(); if(m){ m.date=$("scEdDate").value; buildSchedTimeline(); }});
$("scEdColor").addEventListener("input", ()=>{ const m=curMsObj(); if(m){ m.color=$("scEdColor").value; buildSchedTimeline(); }});
$("scEdDel").addEventListener("click", ()=>{
  if(curMs<0) return;
  const s=getSched(curProj);
  if(!confirm(`刪除里程碑「${s.milestones[curMs].label||""}」？`)) return;
  s.milestones.splice(curMs,1); selectSchedContent(-1); buildSchedTimeline();
});
$("scAddBtn").addEventListener("click", ()=>{
  if(curProj==null) return;
  schedEditorToMem();
  const s = getSched(curProj);
  const times = s.milestones.filter(m=>m.date).map(m=>parseD(m.date).getTime());
  const base = times.length ? Math.max(...times) : (s.start_date ? parseD(s.start_date).getTime() : Date.now());
  const d = new Date(base + 7*dayMs);
  const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  s.milestones.push({label:"新里程碑", date:ds, color:"#ffffff", content:""});
  buildSchedTimeline();
  selectSchedContent(s.milestones.length-1);
  $("scEdLabel").focus();
});
$("scSaveBtn").addEventListener("click", async ()=>{
  if(!IS_OWNER || curProj==null) return;
  schedEditorToMem();
  const s = getSched(curProj);
  const payload = { category: curProj, start_date: s.start_date||null, end_date: s.end_date||null,
                    general_note: s.general_note||null, milestones: s.milestones||[] };
  $("scSaveBtn").disabled = true; $("scSaveHint").textContent = "儲存中…";
  const {error} = await sb.from("project_schedules").upsert(payload, {onConflict:"category"});
  $("scSaveBtn").disabled = false;
  if(error){ $("scSaveHint").textContent = "儲存失敗："+error.message; return; }
  $("scSaveHint").textContent = "已儲存 ✓";
  setTimeout(()=>{ $("scSaveHint").textContent=""; }, 2500);
});

initRichEditor($("scTb"), $("scEditor"), $("scFontSize"));

// ================= 工具 =================
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function safe(s){return String(s||"").replace(/[\\/:*?"<>|]/g,"_").slice(0,30);}
window.openEdit = openEdit;
window.exportOne = exportOne;
window.delRec = delRec;
